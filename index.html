<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Angola — Cultura Geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#141110;
    --paper:#F6F1E4;
    --red:#C8102E;
    --red-deep:#8C0C21;
    --gold:#F0B429;
    --gold-soft:#F6D374;
    --green:#237A57;
    --ink-soft:#5B5450;
    --radius:18px;
    --shadow: 0 18px 40px -18px rgba(20,17,16,0.55);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(200,16,46,0.25), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(240,180,41,0.18), transparent 55%),
      var(--black);
    color:var(--paper);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    line-height:1.45;
  }

  .stage{
    width:100%;
    max-width:560px;
  }

  .brandbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    justify-content:center;
  }
  .brandbar .stripe{
    height:6px;
    width:34px;
    border-radius:4px;
    background:var(--red);
  }
  .brandbar .stripe.gold{ background:var(--gold); width:16px; }
  .brandbar .stripe.black{ background:#000; border:1px solid rgba(246,241,228,0.25); width:16px; }

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(2rem, 7vw, 2.9rem);
    text-align:center;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  h1.title em{
    font-style:normal;
    color:var(--gold-soft);
  }

  .subtitle{
    text-align:center;
    color:rgba(246,241,228,0.72);
    font-size:0.98rem;
    margin:0 0 26px;
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border:1px solid rgba(246,241,228,0.12);
    border-radius:var(--radius);
    padding:26px 22px 22px;
    box-shadow:var(--shadow);
    backdrop-filter: blur(6px);
  }

  /* --- Start screen --- */
  .start-emblem{
    width:74px;
    height:74px;
    margin:2px auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, #b9860f 100%);
    box-shadow: 0 10px 24px -8px rgba(240,180,41,0.55);
    font-size:2rem;
  }

  .facts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:20px 0 24px;
  }
  .facts div{
    text-align:center;
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(246,241,228,0.1);
    border-radius:12px;
    padding:12px 6px;
  }
  .facts .num{
    display:block;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.3rem;
    color:var(--gold-soft);
  }
  .facts .lbl{
    display:block;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:rgba(246,241,228,0.6);
    margin-top:2px;
  }

  .name-label{
    display:block;
    font-size:0.8rem;
    color:rgba(246,241,228,0.65);
    margin-bottom:6px;
  }
  .name-input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid rgba(246,241,228,0.22);
    background:rgba(0,0,0,0.25);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:1rem;
    margin-bottom:18px;
  }
  .name-input::placeholder{ color:rgba(246,241,228,0.4); }
  .name-input:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:2px; }

  button.primary{
    width:100%;
    border:none;
    cursor:pointer;
    background:linear-gradient(180deg, var(--red), var(--red-deep));
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    padding:16px 18px;
    border-radius:14px;
    box-shadow:0 12px 26px -10px rgba(200,16,46,0.6);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.primary:active{ transform:translateY(1px) scale(0.99); }
  button.primary:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:3px; }

  button.ghost{
    width:100%;
    margin-top:12px;
    border:1px solid rgba(246,241,228,0.25);
    background:transparent;
    color:var(--paper);
    font-weight:600;
    font-size:0.95rem;
    padding:13px 18px;
    border-radius:14px;
    cursor:pointer;
  }
  button.ghost:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:3px; }

  /* --- Quiz screen --- */
  .progress-row{
    display:flex;
    gap:5px;
    margin-bottom:18px;
  }
  .progress-row .dot{
    flex:1;
    height:6px;
    border-radius:4px;
    background:rgba(246,241,228,0.14);
    overflow:hidden;
  }
  .progress-row .dot.filled{ background:var(--gold); }
  .progress-row .dot.current{ background:var(--red); }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
    font-size:0.82rem;
    color:rgba(246,241,228,0.65);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .meta-row .score{ color:var(--gold-soft); font-weight:700; }

  .question{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.2rem, 4.6vw, 1.5rem);
    margin:0 0 20px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .option{
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(246,241,228,0.18);
    background:rgba(0,0,0,0.2);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .option:not(:disabled):hover{ border-color:rgba(246,241,228,0.4); }
  .option:not(:disabled):active{ transform:scale(0.99); }
  .option:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:2px; }
  .option .letter{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.8rem;
    font-weight:700;
    background:rgba(246,241,228,0.12);
  }
  .option:disabled{ cursor:default; }

  .option.correct{
    background:rgba(35,122,87,0.28);
    border-color:var(--green);
  }
  .option.correct .letter{ background:var(--green); color:#fff; }

  .option.wrong{
    background:rgba(200,16,46,0.24);
    border-color:var(--red);
  }
  .option.wrong .letter{ background:var(--red); color:#fff; }

  .option.dim{ opacity:0.45; }

  .feedback{
    margin-top:16px;
    padding:12px 14px;
    border-radius:12px;
    font-size:0.92rem;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background:rgba(35,122,87,0.18); border:1px solid rgba(35,122,87,0.5); }
  .feedback.bad{ background:rgba(200,16,46,0.16); border:1px solid rgba(200,16,46,0.45); }
  .feedback strong{ display:block; margin-bottom:2px; }

  .next-row{ margin-top:18px; display:none; }
  .next-row.show{ display:block; }

  /* --- Result screen --- */
  .cert-frame{
    position:relative;
    border:1.5px solid rgba(240,180,41,0.55);
    border-radius:14px;
    padding:28px 20px 22px;
    margin-bottom:18px;
    background:
      linear-gradient(180deg, rgba(240,180,41,0.06), rgba(200,16,46,0.04)),
      rgba(0,0,0,0.18);
    text-align:center;
  }
  .cert-corner{
    position:absolute;
    width:22px; height:22px;
    border:2px solid var(--gold);
  }
  .cert-corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .cert-corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
  .cert-corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
  .cert-corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; }

  .cert-kicker{
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:0.72rem;
    color:rgba(246,241,228,0.6);
    margin:0 0 8px;
  }
  .cert-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--gold-soft);
    margin:0 0 10px;
    border-bottom:1px solid rgba(246,241,228,0.18);
    display:inline-block;
    padding-bottom:6px;
  }
  .cert-note{
    font-size:0.85rem;
    color:rgba(246,241,228,0.6);
    margin:14px 0 0;
    font-style:italic;
  }

  .result-emblem{
    width:96px; height:96px;
    margin:0 auto 14px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:2.4rem;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, #b9860f 100%);
    box-shadow: 0 14px 30px -10px rgba(240,180,41,0.55);
  }
  .result-title{
    font-family:'Fraunces', serif;
    font-weight:800;
    font-size:1.7rem;
    text-align:center;
    margin:0 0 6px;
  }
  .result-score{
    text-align:center;
    color:rgba(246,241,228,0.75);
    margin:0 0 22px;
  }
  .result-score b{ color:var(--gold-soft); font-size:1.15em; }

  .bar-outer{
    height:12px;
    border-radius:8px;
    background:rgba(246,241,228,0.12);
    overflow:hidden;
    margin-bottom:22px;
  }
  .bar-inner{
    height:100%;
    background:linear-gradient(90deg, var(--red), var(--gold));
    border-radius:8px;
    transition:width .6s ease;
  }

  .hidden{ display:none !important; }

  footer{
    text-align:center;
    margin-top:18px;
    font-size:0.78rem;
    color:rgba(246,241,228,0.4);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media print{
    body{ background:#fff !important; color:#111 !important; }
    .brandbar, #screen-start, #screen-quiz, footer,
    #btnPrint, #btnRestart, #btnReview{ display:none !important; }
    .card{ box-shadow:none !important; border:none !important; }
    .cert-frame{ border-color:#b9860f !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brandbar">
    <span class="stripe"></span>
    <span class="stripe black"></span>
    <span class="stripe gold"></span>
  </div>

  <!-- START SCREEN -->
  <section id="screen-start" class="card">
    <div class="start-emblem">🇦🇴</div>
    <h1 class="title">Quiz de <em>Angola</em></h1>
    <p class="subtitle">Cultura geral: história, geografia, símbolos, tradições e mais.</p>

    <div class="facts">
      <div><span class="num" id="qCount">--</span><span class="lbl">Perguntas</span></div>
      <div><span class="num">4</span><span class="lbl">Opções</span></div>
      <div><span class="num">∞</span><span class="lbl">Tentativas</span></div>
    </div>

    <label class="name-label" for="playerName">O teu nome (para o certificado final)</label>
    <input class="name-input" id="playerName" type="text" placeholder="Ex: Bruna Santos" maxlength="40">

    <button class="primary" id="btnStart">Começar o quiz</button>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="screen-quiz" class="card hidden">
    <div class="progress-row" id="progressRow"></div>
    <div class="meta-row">
      <span id="qPosition">Pergunta 1</span>
      <span class="score">Pontos: <span id="scoreLive">0</span></span>
    </div>
    <h2 class="question" id="questionText">--</h2>
    <div class="options" id="optionsWrap"></div>

    <div class="feedback" id="feedbackBox">
      <strong id="feedbackTitle"></strong>
      <span id="feedbackText"></span>
    </div>

    <div class="next-row" id="nextRow">
      <button class="primary" id="btnNext">Próxima pergunta</button>
    </div>
  </section>

  <!-- RESULT / CERTIFICATE SCREEN -->
  <section id="screen-result" class="card hidden">
    <div class="cert-frame">
      <div class="cert-corner tl"></div>
      <div class="cert-corner tr"></div>
      <div class="cert-corner bl"></div>
      <div class="cert-corner br"></div>

      <div class="result-emblem" id="resultEmoji">🏆</div>
      <p class="cert-kicker">Certificado de Reconhecimento</p>
      <h2 class="result-title" id="resultTitle">Título</h2>
      <p class="cert-name" id="certName"></p>
      <p class="result-score">
        demonstrou conhecer a cultura geral de Angola, acertando
        <b id="resultScore">0</b> de <span id="resultTotal">0</span> perguntas
        (<span id="resultPct">0</span>%)
      </p>
      <div class="bar-outer"><div class="bar-inner" id="resultBar" style="width:0%"></div></div>
      <p class="cert-note" id="certNote"></p>
    </div>

    <button class="primary" id="btnPrint">Guardar / imprimir certificado</button>
    <button class="ghost" id="btnRestart">Jogar novamente</button>
    <button class="ghost" id="btnReview">Rever perguntas</button>
  </section>

  <footer>Feito por Bruna 🇦🇴</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "Qual é a capital de Angola?",
    options: ["Huambo", "Luanda", "Benguela", "Lubango"],
    correct: 1,
    note: "Luanda é a capital e também a cidade mais populosa do país."
  },
  {
    q: "Em que dia e ano Angola tornou-se independente de Portugal?",
    options: ["11 de novembro de 1975", "4 de fevereiro de 1961", "25 de abril de 1974", "27 de maio de 1977"],
    correct: 0,
    note: "A independência foi proclamada em Luanda a 11 de novembro de 1975."
  },
  {
    q: "Qual é a moeda oficial de Angola?",
    options: ["Metical", "Rand", "Kwanza", "Escudo"],
    correct: 2,
    note: "O Kwanza (AOA) é a moeda oficial angolana, com o nome inspirado no rio Kwanza."
  },
  {
    q: "Qual é o idioma oficial de Angola?",
    options: ["Francês", "Português", "Inglês", "Espanhol"],
    correct: 1,
    note: "O português é a língua oficial, ao lado de várias línguas nacionais como o umbundu, kimbundu e kikongo."
  },
  {
    q: "Quem foi o primeiro presidente de Angola após a independência?",
    options: ["José Eduardo dos Santos", "Jonas Savimbi", "Agostinho Neto", "João Lourenço"],
    correct: 2,
    note: "Agostinho Neto, também poeta, foi o primeiro presidente, de 1975 a 1979."
  },
  {
    q: "Qual partido político governa Angola desde a independência?",
    options: ["UNITA", "MPLA", "FNLA", "PRS"],
    correct: 1,
    note: "O MPLA (Movimento Popular de Libertação de Angola) está no poder desde 1975."
  },
  {
    q: "Qual é o nome do maior rio de Angola?",
    options: ["Rio Zambeze", "Rio Congo", "Rio Kwanza", "Rio Cunene"],
    correct: 2,
    note: "O Rio Kwanza é o maior rio inteiramente angolano e deu o nome à moeda do país."
  },
  {
    q: "Como se chama o deserto localizado no sul de Angola?",
    options: ["Deserto do Kalahari", "Deserto do Namibe", "Deserto de Atacama", "Deserto do Sahara"],
    correct: 1,
    note: "O Deserto do Namibe estende-se pela costa sul do país."
  },
  {
    q: "Qual é a alcunha da Selecção Nacional de futebol de Angola?",
    options: ["Leões da Teranga", "Palancas Negras", "Águias de Cartago", "Elefantes"],
    correct: 1,
    note: "A selecção é conhecida como Palancas Negras, em homenagem à palanca negra gigante."
  },
  {
    q: "Qual animal é considerado símbolo nacional de Angola?",
    options: ["Leão", "Elefante", "Palanca Negra Gigante", "Rinoceronte"],
    correct: 2,
    note: "A Palanca Negra Gigante é endémica de Angola e um forte símbolo de identidade nacional."
  },
  {
    q: "Qual é o prato tradicional angolano feito à base de farinha de mandioca?",
    options: ["Funge", "Feijoada", "Muamba de galinha", "Calulu"],
    correct: 0,
    note: "O funge é um acompanhamento tradicional feito com farinha de mandioca (ou milho)."
  },
  {
    q: "Que género musical e de dança, hoje popular no mundo inteiro, tem origem em Angola?",
    options: ["Afrobeat", "Kizomba", "Salsa", "Reggaeton"],
    correct: 1,
    note: "A Kizomba nasceu em Angola nos anos 1980 e espalhou-se pelo mundo."
  },
  {
    q: "Quais são as cores da bandeira de Angola?",
    options: ["Verde e amarelo", "Azul e branco", "Vermelho e preto", "Laranja e verde"],
    correct: 2,
    note: "A bandeira é dividida em vermelho e preto, com um emblema amarelo ao centro."
  },
  {
    q: "O emblema amarelo da bandeira de Angola inclui uma catana, uma estrela e...",
    options: ["Um sol", "Meia roda dentada", "Uma pomba", "Um escudo"],
    correct: 1,
    note: "A meia roda dentada representa os operários e a industrialização; a catana, os camponeses; a estrela, a solidariedade internacional."
  },
  {
    q: "Que cidade angolana é famosa pelo seu porto e pelo antigo Caminho de Ferro de Benguela?",
    options: ["Cabinda", "Malanje", "Lobito", "Namibe"],
    correct: 2,
    note: "Lobito é um importante porto ligado ao Caminho de Ferro de Benguela, que atravessa o interior do país."
  },
  {
    q: "Onde ficam as famosas Quedas de Kalandula?",
    options: ["Província de Malanje", "Província de Cabinda", "Província do Huambo", "Província de Luanda"],
    correct: 0,
    note: "As Quedas de Kalandula, na província de Malanje, estão entre as maiores quedas de água de África."
  },
  {
    q: "Qual é o ponto mais alto de Angola?",
    options: ["Serra da Chela", "Morro do Moco", "Monte Kilimanjaro", "Serra da Leba"],
    correct: 1,
    note: "O Morro do Moco, no Huambo, é o ponto mais elevado de Angola, com cerca de 2.620 metros."
  },
  {
    q: "Em que ano terminou a Guerra Civil Angolana?",
    options: ["1992", "1998", "2002", "2010"],
    correct: 2,
    note: "A guerra civil terminou em 2002, após a morte de Jonas Savimbi."
  },
  {
    q: "Qual destes países faz fronteira com Angola?",
    options: ["Quénia", "Namíbia", "Gana", "Egipto"],
    correct: 1,
    note: "Angola faz fronteira com a Namíbia, Zâmbia e a República Democrática do Congo."
  },
  {
    q: "Angola está entre os maiores produtores mundiais de que recurso natural?",
    options: ["Café", "Petróleo", "Trigo", "Cobre"],
    correct: 1,
    note: "O petróleo é o principal produto de exportação e motor da economia angolana, ao lado dos diamantes."
  },
  {
    q: "Quantas províncias tem Angola, de acordo com a divisão administrativa em vigor desde 2025?",
    options: ["18", "20", "21", "24"],
    correct: 2,
    note: "Desde janeiro de 2025, Angola passou de 18 para 21 províncias."
  },
  {
    q: "Qual é a religião predominante em Angola?",
    options: ["Islamismo", "Cristianismo", "Hinduísmo", "Budismo"],
    correct: 1,
    note: "O Cristianismo, com maioria católica, é a religião predominante no país."
  },
  {
    q: "Qual escritor angolano é autor de obras como 'Nação Crioula' e 'O Vendedor de Passados'?",
    options: ["Pepetela", "José Eduardo Agualusa", "Luandino Vieira", "Ondjaki"],
    correct: 1,
    note: "José Eduardo Agualusa é um dos escritores angolanos mais traduzidos internacionalmente."
  },
  {
    q: "Qual província angolana é um enclave, separado do resto do território nacional?",
    options: ["Cabinda", "Zaire", "Bié", "Cunene"],
    correct: 0,
    note: "Cabinda é separada do restante território angolano pela faixa da República Democrática do Congo."
  },
  {
    q: "Que dia se celebra em Angola a 4 de fevereiro?",
    options: ["Dia da Vitória", "Dia do Início da Luta Armada", "Dia da Independência", "Dia da Paz"],
    correct: 1,
    note: "A 4 de fevereiro celebra-se o início da luta armada de libertação nacional, em 1961."
  },
  {
    q: "Aproximadamente quantos habitantes tem Angola, segundo o Censo 2024?",
    options: ["18 milhões", "25 milhões", "36,6 milhões", "50 milhões"],
    correct: 2,
    note: "O Censo 2024 registou 36,6 milhões de habitantes, um crescimento de 42% face a 2014."
  },
  {
    q: "Qual é o maior grupo etnolinguístico de Angola?",
    options: ["Bakongo", "Ovimbundo", "Lunda-Chókwe", "Herero"],
    correct: 1,
    note: "Os ovimbundos são o maior grupo etnolinguístico, concentrados sobretudo no planalto central."
  },
  {
    q: "Depois do português, qual é a língua nacional mais falada em Angola?",

let current = 0;
let score = 0;
let answered = false;
let userAnswers = [];
let playerName = "";

const TITLES = [
  { min: 90, emoji: "🏆", title: "Verdadeiro(a) Conhecedor(a) de Angola", note: "Domínio de topo sobre a história, geografia e cultura angolana." },
  { min: 70, emoji: "🥇", title: "Grande Conhecedor(a) da Cultura Angolana", note: "Um excelente conhecimento sobre o país." },
  { min: 50, emoji: "🥈", title: "Amigo(a) de Angola", note: "Já conheces bem várias partes da cultura angolana." },
  { min: 30, emoji: "🥉", title: "Curioso(a) sobre Angola", note: "Um bom começo — vale a pena explorar mais." },
  { min: 0,  emoji: "🌱", title: "Explorador(a) Iniciante", note: "O início de uma jornada para conhecer Angola." }
];

function titleFor(pct){
  return TITLES.find(t => pct >= t.min);
}

const screenStart = document.getElementById('screen-start');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');

document.getElementById('qCount').textContent = QUESTIONS.length;

document.getElementById('btnStart').addEventListener('click', startQuiz);
document.getElementById('btnNext').addEventListener('click', nextQuestion);
document.getElementById('btnRestart').addEventListener('click', restartQuiz);
document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('btnReview').addEventListener('click', () => {
  current = 0;
  screenResult.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  renderReviewMode();
});

function startQuiz(){
  current = 0;
  score = 0;
  answered = false;
  userAnswers = [];
  playerName = document.getElementById('playerName').value.trim();
  screenStart.classList.add('hidden');
  screenResult.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  buildProgressRow();
  renderQuestion();
}

function restartQuiz(){
  startQuiz();
}

function buildProgressRow(){
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.dataset.index = i;
    row.appendChild(d);
  });
}

function updateProgressRow(){
  const dots = document.querySelectorAll('#progressRow .dot');
  dots.forEach((d, i) => {
    d.classList.remove('filled', 'current');
    if (i < current) d.classList.add('filled');
    else if (i === current) d.classList.add('current');
  });
}

function renderQuestion(){
  answered = false;
  updateProgressRow();
  document.getElementById('qPosition').textContent = `Pergunta ${current + 1} de ${QUESTIONS.length}`;
  document.getElementById('scoreLive').textContent = score;

  const item = QUESTIONS[current];
  document.getElementById('questionText').textContent = item.q;

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(idx));
    wrap.appendChild(btn);
  });

  document.getElementById('feedbackBox').className = 'feedback';
  document.getElementById('nextRow').className = 'next-row';

  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = current === QUESTIONS.length - 1 ? 'Ver resultado' : 'Próxima pergunta';
}

function selectAnswer(idx){
  if (answered) return;
  answered = true;

  const item = QUESTIONS[current];
  const isCorrect = idx === item.correct;
  if (isCorrect) score++;

  userAnswers[current] = idx;

  const buttons = document.querySelectorAll('#optionsWrap .option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct){
      btn.classList.add('correct');
    } else if (i === idx){
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });

  const box = document.getElementById('feedbackBox');
  const title = document.getElementById('feedbackTitle');
  const text = document.getElementById('feedbackText');

  if (isCorrect){
    box.className = 'feedback show ok';
    title.textContent = 'Certo! 🎉';
  } else {
    box.className = 'feedback show bad';
    title.textContent = `Errado — a resposta certa é: ${item.options[item.correct]}`;
  }
  text.textContent = item.note;

  document.getElementById('scoreLive').textContent = score;
  document.getElementById('nextRow').className = 'next-row show';
}

function nextQuestion(){
  if (current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');

  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);
  const tier = titleFor(pct);

  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultTotal').textContent = total;
  document.getElementById('resultPct').textContent = pct;
  document.getElementById('resultBar').style.width = pct + '%';

  document.getElementById('resultEmoji').textContent = tier.emoji;
  document.getElementById('resultTitle').textContent = tier.title;
  document.getElementById('certNote').textContent = tier.note;

  const nameEl = document.getElementById('certName');
  nameEl.textContent = playerName ? playerName : "Jogador(a)";
}

function renderReviewMode(){
  // simple linear review reusing the quiz screen with answers locked in
  renderQuestion();
  const item = QUESTIONS[current];
  const chosen = userAnswers[current];
  if (chosen === undefined) return;

  const buttons = document.querySelectorAll('#optionsWrap .option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const box = document.getElementById('feedbackBox');
  const title = document.getElementById('feedbackTitle');
  const text = document.getElementById('feedbackText');
  const isCorrect = chosen === item.correct;
  box.className = isCorrect ? 'feedback show ok' : 'feedback show bad';
  title.textContent = isCorrect ? 'Tinhas acertado ✅' : `A resposta certa é: ${item.options[item.correct]}`;
  text.textContent = item.note;

  document.getElementById('nextRow').className = 'next-row show';
  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = current === QUESTIONS.length - 1 ? 'Voltar ao resultado' : 'Próxima pergunta';
  btnNext.onclick = () => {
    if (current < QUESTIONS.length - 1){
      current++;
      renderReviewMode();
    } else {
      btnNext.onclick = nextQuestion;
      showResult();
    }
  };
}
</script>
